name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  GOTOOLCHAIN: local

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Verify and package
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify pinned toolchain
        run: ./scripts/Assert-Toolchain.ps1

      - name: Install dashboard dependencies
        run: ./scripts/Bootstrap.ps1

      - name: Format, analyze, test, and build
        run: ./scripts/Verify.ps1 -Version $env:GITHUB_SHA
        env:
          DARKSTAR_SCHEMA_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Verify reproducible binary and package
        run: ./scripts/Verify-ReproducibleBuild.ps1 -Version $env:GITHUB_SHA

      - name: Package Windows binary
        run: ./scripts/Package.ps1 -Version $env:GITHUB_SHA

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: out/darkstar-${{ github.sha }}-windows-amd64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload SHA-256 checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: out/darkstar-${{ github.sha }}-windows-amd64.zip.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14
